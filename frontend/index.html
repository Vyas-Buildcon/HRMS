    <script>
      // Squelch unhandled errors and promise rejections originating from third-party browser extensions (e.g. MetaMask, web3 wallets, grammarly)
      (function() {
        function isExtensionNoise(err, source) {
          try {
            var msg = String((err && (err.message || err.stack || err.reason || err)) || '');
            var src = String(source || (err && (err.filename || err.stack)) || '');
            var text = (msg + ' ' + src).toLowerCase();
            return (
              text.indexOf('chrome-extension://') !== -1 ||
              text.indexOf('moz-extension://') !== -1 ||
              text.indexOf('safari-extension://') !== -1 ||
              text.indexOf('nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
              text.indexOf('metamask') !== -1 ||
              text.indexOf('failed to connect to metamask') ||
              text.indexOf('ethereum') !== -1
            );
          } catch (e) {
            return false;
          }
        }

        window.addEventListener('error', function(event) {
          if (isExtensionNoise(event.error, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionNoise(event.reason, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
